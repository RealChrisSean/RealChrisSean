name: Mention Monitor

# Runs the agent on a schedule and commits the updated dedup state back so the
# next run knows what it has already seen. Also runnable on demand.
on:
  schedule:
    - cron: "0 * * * *" # hourly, on the hour (UTC)
  workflow_dispatch: {}

# Needed so the job can push the updated state/seen.json back to the branch.
permissions:
  contents: write

# Don't let a slow run overlap the next scheduled one.
concurrency:
  group: mention-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mention-monitor
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Run monitor
        env:
          KEYWORDS: ${{ vars.KEYWORDS || 'fly.io,flydotio' }}
          SOURCE_TWITTER: ${{ vars.SOURCE_TWITTER || 'false' }}
          TWITTER_BEARER_TOKEN: ${{ secrets.TWITTER_BEARER_TOKEN }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: npm start

      - name: Persist dedup state
        run: |
          if [[ -n "$(git status --porcelain state/seen.json)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add state/seen.json
            git commit -m "chore: update mention-monitor seen state [skip ci]"
            git push
          else
            echo "No state change to commit."
          fi
